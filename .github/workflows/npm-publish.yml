name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect Node package
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
            echo "Node package detected."
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found. Build will be skipped cleanly."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has_package == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_package == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests when configured
        if: steps.detect.outputs.has_package == 'true'
        shell: bash
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "No npm test script found. Skipping tests."
          fi

      - name: Skip build when package.json is absent
        if: steps.detect.outputs.has_package != 'true'
        shell: bash
        run: echo "Repository has no package.json. Nothing to build."

  publish-npm:
    name: publish-npm
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect Node package
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js for npm publish
        if: steps.detect.outputs.has_package == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.has_package == 'true'
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Publish package
        if: steps.detect.outputs.has_package == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: $${{ secrets.NPM_TOKEN }}

      - name: Skip publish when package.json is absent
        if: steps.detect.outputs.has_package != 'true'
        shell: bash
        run: echo "No package.json found. npm publish skipped."
